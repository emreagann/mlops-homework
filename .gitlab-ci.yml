stages:
  - build
  - test
  - lint
  - package
  - smoke-test

variables:
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA

# 1. Build & Install Dependencies
build_job:
  stage: build
  image: python:3.9
  script:
    - python -m venv venv
    - source venv/bin/activate
    - pip install -r requirements.txt
    - pip install pytest flake8
  artifacts:
    paths:
      - venv/
    expire_in: 1 hour

# 2. Automated Unit Testing
unit_test_job:
  stage: test
  image: python:3.9
  script:
    - source venv/bin/activate
    - pytest tests/test_unit.py

# 3. Code Analysis/Linting
lint_job:
  stage: lint
  image: python:3.9
  script:
    - source venv/bin/activate
    - flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics

# 4. Package (Build Docker Image)
package_job:
  stage: package
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker build -t my-ml-service .

# 5. Smoke Test (Deployment Verification)
smoke_test_job:
  stage: smoke-test
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker build -t my-ml-service .
    - docker run -d -p 8000:8000 --name ml_service my-ml-service
    - sleep 10
    - apk add --no-cache python3 py3-pip
    - pip install requests --break-system-packages
    - python3 smoke_test.py
